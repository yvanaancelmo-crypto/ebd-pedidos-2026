<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EBD Pedidos 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2 class="text-center mb-4">📋 Pedidos EBD - 1º Trimestre 2026</h2>
    <div class="table-responsive">
        <table class="table table-hover table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Status (Clique para mudar)</th>
                    <th>Forma</th>
                    <th>Valor Pago</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody>
                {% for nome in pessoas %}
                {% set p = pessoas_data[nome] %}
                <tr>
                    <td><strong>{{ nome }}</strong></td>
                    <td>
                        <select class="form-select form-select-sm" onchange="salvar('{{ nome }}', 'status', this.value)">
                            <option value="" {% if p.status == "" %}selected{% endif %}>Selecione...</option>
                            <option value="PENDENTE" {% if p.status == "PENDENTE" %}selected{% endif %}>🔴 PENDENTE</option>
                            <option value="PAGO" {% if p.status == "PAGO" %}selected{% endif %}>🟢 PAGO</option>
                            <option value="PARCIAL" {% if p.status == "PARCIAL" %}selected{% endif %}>🟡 PAGO METADE</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-select form-select-sm" onchange="salvar('{{ nome }}', 'forma', this.value)">
                            <option value="" {% if p.forma == "" %}selected{% endif %}>-</option>
                            <option value="PIX" {% if p.forma == "PIX" %}selected{% endif %}>PIX</option>
                            <option value="DINHEIRO" {% if p.forma == "DINHEIRO" %}selected{% endif %}>DINHEIRO</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" class="form-control form-control-sm" value="{{ p.valor_pago }}" onblur="salvar('{{ nome }}', 'valor_pago', this.value)">
                    </td>
                    <td>
                        <input type="text" class="form-control form-control-sm" value="{{ p.data }}" onblur="salvar('{{ nome }}', 'data', this.value)" placeholder="dd/mm">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        function salvar(nome, campo, valor) {
            fetch('/salvar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome: nome, campo: campo, valor: valor})
            }).then(res => res.json()).then(data => { if(data.ok) console.log("Salvo!"); });
        }
    </script>
</body>
</html>
